data:
  NUMCHAN: 4  # number of channels on the device
  FSAMPLING: 250 # sampling rate of the device in Hz
  sigduration: full  # int number or 'full'; redundant for sigtype=full
  sigtype: full  # signal before trigger / stimulation
  dirprefix: pib
  featname: pib  # power in band feature
  trigger: Scheduled  # compute features of ECoG clips from this trigger
preproc:
  bands: ['theta', 'alpha', 'beta', 'gamma', 'broadband'] # name of bands
  band_cutoffs: {'theta':[4, 7], 'alpha':[8, 13], 'beta':[14, 30], 'gamma':[30, 70]} # frequency cutoffs
  normalize: False  # normalization strategy for the data
  filter_order: 2   # order of butterworth filter
  filter_pass: bp   # band pass, low pass, high pass
  filter_type: sos  # band pass filter type; sos is more stable
  ntmin: 15 # minimum number of timepoint samples to enable filtering
stim:
  remove_stim_artifacts: True  # if stimulation artifacts should be removed from data
  NUMCHAN: ${data.NUMCHAN}  # number of channels; used in stimulation detection code
  MIN_ARTIFACT_LENGTH: 10  # minimum number of successive constant samples to detect a stimulation
  POST_STIM_BUFFER: 100  # number of samples to remove after stimulation ends
  SIDE_CLIP_LEN: ${data.FSAMPLING} # number of samples to remove on either side of stim in filtered signal